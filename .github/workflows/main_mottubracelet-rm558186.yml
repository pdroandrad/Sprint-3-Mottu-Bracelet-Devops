name: 'Build and deploy ASP.Net Core app to Azure Web App: mottubracelet-rm558186'

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v3

      - name: Setup .NET
        uses: actions/setup-dotnet@v3
        with:
          dotnet-version: '8.x'

      - name: Build with dotnet
        run: dotnet build --configuration Release

      - name: Publish with dotnet
        run: dotnet publish -c Release -o ${{ env.DOTNET_ROOT }}/myapp

      - name: Deploy to Azure Web App
        uses: azure/webapps-deploy@v2
        with:
          app-name: 'mottubracelet-rm558186'
          slot-name: 'production'
          publish-profile: ${{ secrets.AZUREAPPSERVICE_PUBLISHPROFILE_214384DA4F39430A83631D0316DE8B9C }}
          package: ${{ env.DOTNET_ROOT }}/myapp
        env:
          ConnectionStrings__DefaultConnection: ${{ secrets.DefaultConnection }}
